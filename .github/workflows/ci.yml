name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build, lint & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Assemble debug
        run: ./gradlew assembleDebug

      - name: Unit tests
        run: >
          ./gradlew testDebugUnitTest
          :core:common:test :core:model:test :core:domain:test :core:testing:test

      - name: Android lint
        run: ./gradlew lintDebug

      # Room regenerates the schema during the build. On branch pushes the
      # updated schema is committed back (CI already validated the code); on
      # pull requests a stale schema fails the build.
      - name: Room schema is committed
        run: |
          if [ -z "$(git status --porcelain core/database/schemas)" ]; then
            echo "Schema is up to date."
            exit 0
          fi
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "::error::Room schema changed. Commit the files under core/database/schemas."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/database/schemas
          git commit -m "Update Room schema"
          git push

      - name: Report test failures
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for path in glob.glob("**/build/test-results/**/*.xml", recursive=True):
              for case in ET.parse(path).getroot().iter("testcase"):
                  for failure in case.findall("failure") + case.findall("error"):
                      message = " ".join((failure.get("message") or failure.text or "").split())[:900]
                      print(f"::error title={case.get('classname')}.{case.get('name')}::{message}")
          for path in glob.glob("**/build/reports/lint-results-debug.xml", recursive=True):
              for issue in ET.parse(path).getroot().iter("issue"):
                  if issue.get("severity") in ("Error", "Fatal"):
                      location = issue.find("location")
                      where = f"{location.get('file')}:{location.get('line')}" if location is not None else path
                      print(f"::error title=Lint {issue.get('id')}::{where} {issue.get('message')}")
          PY

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7

      - name: Upload debug APK
        uses: actions/upload-artifact@v5
        with:
          name: jalilgym-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
