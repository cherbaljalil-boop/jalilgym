name: Baseline Profile

# Generates the app's Baseline Profile on an emulator and commits it, then
# measures cold start with and without it. Run it before a release, or after
# big changes to startup or navigation.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Generate Baseline Profile
        run: >
          ./gradlew :app:generateReleaseBaselineProfile
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
          -Pandroid.experimental.testOptions.managedDevices.setupTimeoutMinutes=20

      - name: Benchmark cold start
        continue-on-error: true
        run: >
          ./gradlew :baselineprofile:pixel6Api34BenchmarkReleaseAndroidTest
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
          -Pandroid.testInstrumentationRunnerArguments.class=com.chdjalil.jalilgym.baselineprofile.StartupBenchmark
          -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.suppressErrors=EMULATOR

      - name: Commit profile
        run: |
          git add app/src/release/generated/baselineProfiles
          if git diff --cached --quiet; then
            echo "Profile unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Baseline Profile"
          git push

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: baseline-profile
          path: |
            app/src/release/generated/baselineProfiles/
            baselineprofile/build/outputs/
            baselineprofile/build/reports/
          retention-days: 14
