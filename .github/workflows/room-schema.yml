name: Update Room schema

# Manually triggered: regenerates core/database/schemas and commits it to the
# selected branch. Use when the schema changed and can't be built locally.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Generate schema
        run: ./gradlew :core:database:assembleDebug

      - name: Commit schema
        run: |
          if [ -z "$(git status --porcelain core/database/schemas)" ]; then
            echo "Schema is up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/database/schemas
          git commit -m "Update Room schema"
          git push
