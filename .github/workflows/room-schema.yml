name: Update Room schema

# Regenerates core/database/schemas whenever the database module changes and
# commits the result to the same branch, so the schema can be kept in git even
# without a local Android build. It can also be run by hand.
on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "core/database/**"
      - ".github/workflows/room-schema.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Generate schema
        run: ./gradlew :core:database:assembleDebug

      - name: Commit schema
        run: |
          if [ -z "$(git status --porcelain core/database/schemas)" ]; then
            echo "Schema is up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/database/schemas
          git commit -m "Update Room schema"
          git push
