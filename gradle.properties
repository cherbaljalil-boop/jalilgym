org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# First Play release: release builds leave out Health Connect (no health-permission
# review) and cloud sync. Debug builds keep both for testing. Set to true to ship them.
jalilgym.healthConnectInRelease=false
jalilgym.cloudSyncInRelease=false
